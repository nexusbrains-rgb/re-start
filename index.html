<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Re-start — Hero Video</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<style>
  html, body { margin: 0; padding: 0; background: #fff; overflow: hidden; height: 100%; }
  body { font-family: "Noto Sans JP", system-ui, sans-serif; }

  /* Floating share bar */
  .share-bar {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px;
    z-index: 1000;
    transition: opacity .25s ease;
  }
  .share-bar.recording { opacity: 0.25; }
  .share-bar.recording:hover { opacity: 1; }

  .share-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    background: rgba(255,255,255,0.92);
    color: #0E0F12;
    border: 1px solid #DEDDD7;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    transition: transform .15s ease, background .15s ease;
  }
  .share-btn:hover { transform: translateY(-1px); }
  .share-btn.primary {
    background: #0E0F12;
    color: #fff;
    border-color: #0E0F12;
  }
  .share-btn.recording-btn {
    background: oklch(0.60 0.23 24);
    color: #fff;
    border-color: oklch(0.60 0.23 24);
  }
  .rec-dot {
    width: 9px; height: 9px;
    background: oklch(0.60 0.23 24);
    border-radius: 50%;
  }
  .share-btn.primary .rec-dot { background: oklch(0.60 0.23 24); }
  .rec-dot.live {
    background: #fff;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="image-slot.js"></script>
<script src="photo-data.js"></script>
<script type="text/babel" src="hero-shared.jsx"></script>
<script type="text/babel" src="hero-variations.jsx"></script>
<script type="text/babel" src="video-app.jsx"></script>
</body>
</html>
